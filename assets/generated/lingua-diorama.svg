<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1000" role="img" aria-labelledby="title desc">
  <title id="title">Lingua Quest Yogyakarta learning diorama</title>
  <desc id="desc">An original low-poly isometric illustration with a pendopo-inspired pavilion, step-free path, welcome table, greenery, two abstract exchange participants, and a mission marker.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e7eee8"/>
      <stop offset="1" stop-color="#b8d4ce"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2=".8" y2="1">
      <stop offset="0" stop-color="#b8cda7"/>
      <stop offset="1" stop-color="#7fa78d"/>
    </linearGradient>
    <linearGradient id="roof" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#253c52"/>
      <stop offset="1" stop-color="#101d2e"/>
    </linearGradient>
    <linearGradient id="path" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fffaf0"/>
      <stop offset="1" stop-color="#ded5c2"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="170%" height="180%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="18"/>
      <feOffset dy="24"/>
      <feColorMatrix values="0 0 0 0 0.09 0 0 0 0 0.15 0 0 0 0 0.24 0 0 0 .2 0"/>
      <feBlend in="SourceGraphic"/>
    </filter>
    <filter id="smallShadow" x="-30%" y="-30%" width="170%" height="180%">
      <feDropShadow dx="-8" dy="15" stdDeviation="8" flood-color="#17263c" flood-opacity=".2"/>
    </filter>
    <pattern id="grain" width="80" height="80" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="18" r="1" fill="#17263c" opacity=".08"/>
      <circle cx="55" cy="28" r=".8" fill="#17263c" opacity=".06"/>
      <circle cx="31" cy="67" r=".7" fill="#17263c" opacity=".07"/>
    </pattern>
  </defs>

  <!-- atmospheric field -->
  <rect width="1400" height="1000" fill="url(#sky)"/>
  <circle cx="1160" cy="178" r="120" fill="#e7a447" opacity=".7"/>
  <path d="M0 214 468 0h364L0 380Z" fill="#fff" opacity=".2"/>
  <path d="M1114 0h286v410l-90-51Z" fill="#147d80" opacity=".08"/>

  <!-- floating isometric site -->
  <g filter="url(#shadow)">
    <path d="m700 178 594 297-594 342L106 475Z" fill="url(#ground)"/>
    <path d="m106 475 594 342v72L106 546Z" fill="#587f70"/>
    <path d="m700 817 594-342v72L700 889Z" fill="#3e6d65"/>
    <path d="m700 178 594 297-43 25-551-276-551 318-43-25Z" fill="#d6dfbc" opacity=".4"/>
  </g>

  <!-- low-poly planting zones -->
  <path d="m163 480 227-131 152 76-229 132Z" fill="#5e9277"/>
  <path d="m313 557 229-132 63 32-229 132Z" fill="#477e69"/>
  <path d="m901 355 206 103-136 78-206-103Z" fill="#6b9d7f"/>
  <path d="m1004 590 176-102 103 52-177 102Z" fill="#4e846e"/>

  <!-- step-free path and gentle pavilion ramp -->
  <path d="M659 816 483 714l373-215 128 64Z" fill="url(#path)"/>
  <path d="m483 714 176 102 18-10-176-102Z" fill="#c1b8a4"/>
  <path d="m856 499 128 64-31 18-128-64Z" fill="#ede6d7"/>
  <path d="m659 816 294-169v-66L677 741Z" fill="#e8dfce"/>
  <path d="m677 741 276-160v66L659 816v-54Z" fill="#f8f1e5"/>
  <path d="m698 764 255-147" fill="none" stroke="#147d80" stroke-width="8" stroke-dasharray="3 18" stroke-linecap="round" opacity=".55"/>

  <!-- pendopo-inspired pavilion deck -->
  <g filter="url(#smallShadow)">
    <path d="m510 477 325-188 280 140-326 188Z" fill="#aa6544"/>
    <path d="m510 477 279 140v54L510 530Z" fill="#784735"/>
    <path d="m789 617 326-188v54L789 671Z" fill="#8b513a"/>

    <!-- open columns -->
    <path d="m578 430 25 13v165l-25-13Z" fill="#c78050"/>
    <path d="m603 443 17-10v165l-17 10Z" fill="#92543d"/>
    <path d="m777 535 25 13v165l-25-13Z" fill="#c78050"/>
    <path d="m802 548 17-10v165l-17 10Z" fill="#92543d"/>
    <path d="m986 364 25 13v164l-25-12Z" fill="#c78050"/>
    <path d="m1011 377 17-10v164l-17 10Z" fill="#92543d"/>
    <path d="m804 262 25 13v165l-25-13Z" fill="#c78050"/>
    <path d="m829 275 17-10v165l-17 10Z" fill="#92543d"/>

    <!-- layered joglo-inspired roof silhouette -->
    <path d="m440 399 380-219 365 182-381 221Z" fill="url(#roof)"/>
    <path d="m440 399 364 184v42L440 440Z" fill="#0d1826"/>
    <path d="m804 583 381-221v42L804 625Z" fill="#1c3247"/>
    <path d="m597 342 226-229 221 207-240 139Z" fill="#2f4b5f"/>
    <path d="m597 342 207 117 240-139-221-96Z" fill="#17263c" opacity=".55"/>
    <path d="m765 170 58-57 56 53-56 32Z" fill="#e7a447"/>
    <path d="m817 90 6-32 7 28 30 7-29 7-8 29-7-28-28-8Z" fill="#f6f3ec" opacity=".9"/>
  </g>

  <!-- welcome table -->
  <g filter="url(#smallShadow)">
    <path d="m430 580 153-88 126 63-154 89Z" fill="#f6f3ec"/>
    <path d="m430 580 125 64v70l-125-63Z" fill="#d3c8b4"/>
    <path d="m555 644 154-89v70l-154 89Z" fill="#bcae96"/>
    <path d="m495 540 91-53 67 34-92 53Z" fill="#147d80"/>
    <path d="m506 539 73-42 57 28-74 43Z" fill="#f6f3ec" opacity=".2"/>
    <path d="m575 481 11 6v26l-11-6Z" fill="#17263c"/>
    <path d="m586 487 7-4v26l-7 4Z" fill="#101d2e"/>
    <circle cx="579" cy="478" r="12" fill="#e7a447"/>
  </g>

  <!-- greenery: faceted trees and shrubs -->
  <g filter="url(#smallShadow)">
    <g transform="translate(242 360)">
      <path d="M18 126 32 118v75l-14 8Z" fill="#6c4936"/><path d="m32 118 13 7v75l-13-7Z" fill="#49362f"/>
      <path d="M-28 93 28 0l61 89-58 34Z" fill="#147d80"/><path d="M28 0v123l61-34Z" fill="#0f6668"/><path d="m-28 93 59 30L28 0Z" fill="#31918a"/>
    </g>
    <g transform="translate(1090 410) scale(.82)">
      <path d="M18 126 32 118v75l-14 8Z" fill="#6c4936"/><path d="m32 118 13 7v75l-13-7Z" fill="#49362f"/>
      <path d="M-28 93 28 0l61 89-58 34Z" fill="#147d80"/><path d="M28 0v123l61-34Z" fill="#0f6668"/><path d="m-28 93 59 30L28 0Z" fill="#31918a"/>
    </g>
    <g transform="translate(1120 602) scale(.55)">
      <path d="M18 126 32 118v75l-14 8Z" fill="#6c4936"/><path d="m32 118 13 7v75l-13-7Z" fill="#49362f"/>
      <path d="M-28 93 28 0l61 89-58 34Z" fill="#147d80"/><path d="M28 0v123l61-34Z" fill="#0f6668"/><path d="m-28 93 59 30L28 0Z" fill="#31918a"/>
    </g>
    <path d="m283 630 45-27 46 23-46 27Z" fill="#e7a447"/>
    <path d="m1060 685 52-30 56 28-53 31Z" fill="#e7a447"/>
    <path d="m351 648 36-21 39 19-37 22Z" fill="#f6f3ec" opacity=".8"/>
  </g>

  <!-- two abstract exchange participants -->
  <g filter="url(#smallShadow)">
    <g transform="translate(679 555)">
      <ellipse cx="0" cy="98" rx="43" ry="20" fill="#17263c" opacity=".14"/>
      <path d="m-28 36 31-18 35 18-31 18Z" fill="#e7a447"/>
      <path d="M-28 36 7 54v57l-35-18Z" fill="#d88d3e"/>
      <path d="m7 54 31-18v57L7 111Z" fill="#b96d2b"/>
      <path d="m-15 91 14 7-7 47-15-7Z" fill="#17263c"/><path d="m15 98 13-8 6 43-14 8Z" fill="#253c52"/>
      <path d="M-9 2 7-7 24 2 8 12Z" fill="#a86d50"/><path d="M-9 2 8 12v22L-9 25Z" fill="#936047"/><path d="M8 12 24 2v22L8 34Z" fill="#7a4c3c"/>
      <path d="m-11-2 18-11L27-3 8 8Z" fill="#17263c"/>
    </g>
    <g transform="translate(770 590)">
      <ellipse cx="0" cy="98" rx="43" ry="20" fill="#17263c" opacity=".14"/>
      <path d="m-28 36 31-18 35 18-31 18Z" fill="#31a09b"/>
      <path d="M-28 36 7 54v57l-35-18Z" fill="#147d80"/>
      <path d="m7 54 31-18v57L7 111Z" fill="#0f6668"/>
      <path d="m-15 91 14 7-7 47-15-7Z" fill="#17263c"/><path d="m15 98 13-8 6 43-14 8Z" fill="#253c52"/>
      <path d="M-9 2 7-7 24 2 8 12Z" fill="#bc7b5d"/><path d="M-9 2 8 12v22L-9 25Z" fill="#a26950"/><path d="M8 12 24 2v22L8 34Z" fill="#8d5746"/>
      <path d="m-11-2 18-11L27-3 8 8Z" fill="#2c2630"/>
    </g>
  </g>

  <!-- accessible route sign -->
  <g transform="translate(1010 660)" filter="url(#smallShadow)">
    <path d="M0 20 54-11l55 27-55 32Z" fill="#fff"/>
    <path d="m0 20 54 28v66L0 86Z" fill="#e5ddd0"/>
    <path d="m54 48 55-32v66l-55 32Z" fill="#cbbfaa"/>
    <circle cx="31" cy="46" r="7" fill="#147d80"/>
    <path d="m31 55 1 20 15 8m-15-18-12 11m12-4 14-8" fill="none" stroke="#147d80" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="37" cy="83" r="19" fill="none" stroke="#147d80" stroke-width="5"/>
  </g>

  <!-- mission pin -->
  <g transform="translate(875 535)" filter="url(#smallShadow)">
    <path d="M0 0c0-42 34-76 76-76s76 34 76 76c0 57-76 127-76 127S0 57 0 0Z" fill="#17263c"/>
    <circle cx="76" cy="0" r="48" fill="#e7a447"/>
    <circle cx="76" cy="0" r="35" fill="none" stroke="#17263c" stroke-width="3" stroke-dasharray="5 7"/>
    <text x="76" y="10" text-anchor="middle" font-family="Arial, sans-serif" font-size="29" font-weight="700" fill="#17263c">01</text>
  </g>

  <!-- foreground route dots -->
  <path d="M345 720c105 46 171 99 294 96" fill="none" stroke="#f6f3ec" stroke-width="6" stroke-linecap="round" stroke-dasharray="2 23" opacity=".8"/>
  <circle cx="338" cy="717" r="16" fill="#147d80" stroke="#fff" stroke-width="7"/>
  <circle cx="643" cy="815" r="16" fill="#e7a447" stroke="#fff" stroke-width="7"/>

  <rect width="1400" height="1000" fill="url(#grain)" pointer-events="none"/>
</svg>
